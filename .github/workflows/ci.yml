name: CI and macOS alpha

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*-alpha.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0; reads packageManager
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Check release versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs
      - run: pnpm check
      - name: Verify lockfiles stayed unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          key: arm64-release
      - run: pnpm install --frozen-lockfile
      - name: Build Apple Silicon macOS app and disk image
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg -- --locked
      - name: Verify and package release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Githeaven.app
          lipo "$app/Contents/MacOS/githeaven" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          mkdir release-assets
          ditto -c -k --sequesterRsrc --keepParent "$app" "release-assets/Githeaven_${RELEASE_TAG}_arm64.app.zip"
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-assets/
          cd release-assets
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
      - name: Publish alpha after successful build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --prerelease --latest=false \
            --title "Githeaven ${RELEASE_TAG}" \
            --notes-file .github/alpha-release-notes.md
